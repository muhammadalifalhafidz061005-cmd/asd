<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Past Perfect Tense</title>
    <style>
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            -webkit-user-select: text;
            user-select: text;
        }
        .question {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .question p {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .options label {
            font-weight: normal;
            display: block;
            padding: 8px 12px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .options input {
            margin-right: 10px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #statusMsg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <h2>Kuis Past Perfect Tense</h2>
    
    <div class="input-group">
        <label for="namaSiswa">Nama Lengkap:</label>
        <input type="text" id="namaSiswa" placeholder="Masukkan nama Anda..." autocomplete="off">
    </div>

    <form id="quizForm">
        <!-- Soal 1 -->
        <div class="question">
            <p>1. By the time the teacher arrived, the students _____ their homework.</p>
            <div class="options">
                <label><input type="radio" name="q1" value="A"> A) finished</label>
                <label><input type="radio" name="q1" value="B"> B) had finished</label>
                <label><input type="radio" name="q1" value="C"> C) have finished</label>
            </div>
        </div>

        <!-- Soal 2 -->
        <div class="question">
            <p>2. She _____ already _____ when I called her.</p>
            <div class="options">
                <label><input type="radio" name="q2" value="A"> A) had / slept</label>
                <label><input type="radio" name="q2" value="B"> B) has / slept</label>
                <label><input type="radio" name="q2" value="C"> C) was / sleeping</label>
            </div>
        </div>

        <!-- Soal 3 -->
        <div class="question">
            <p>3. They couldn't enter the house because they _____ the key.</p>
            <div class="options">
                <label><input type="radio" name="q3" value="A"> A) lost</label>
                <label><input type="radio" name="q3" value="B"> B) have lost</label>
                <label><input type="radio" name="q3" value="C"> C) had lost</label>
            </div>
        </div>

        <button type="button" id="btnKirim" onclick="submitQuiz()">Kirim Jawaban</button>
    </form>

    <div id="statusMsg"></div>
</div>

<script>
    // URL Web App Google Apps Script
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqxCASYBYvIXVGOR0dLMWZh4909j00YonhQRuP8TQDdkfT1CapJ8R6odLSJSOQni3p/exec";

    // Kunci Jawaban
    const jawabanBenar = {
        q1: "B",
        q2: "A",
        q3: "C"
    };

    let jumlahCurang = 0;

    // Deteksi Pindah Tab / Buka Aplikasi Lain
    document.addEventListener("visibilitychange", function() {
        if (document.hidden) {
            jumlahCurang++;
        }
    });

    function submitQuiz() {
        const nama = document.getElementById("namaSiswa").value.trim();
        const statusDiv = document.getElementById("statusMsg");
        const btnKirim = document.getElementById("btnKirim");

        if (nama === "") {
            alert("Harap isi nama lengkap Anda terlebih dahulu!");
            return;
        }

        // Hitung Skor
        let skorTotal = 0;
        let detailJawaban = [];
        const totalSoal = Object.keys(jawabanBenar).length;

        for (let i = 1; i <= totalSoal; i++) {
            const selectedOption = document.querySelector(`input[name="q${i}"]:checked`);
            const val = selectedOption ? selectedOption.value : "Tidak Diisi";
            
            if (val === jawabanBenar[`q${i}`]) {
                skorTotal += (100 / totalSoal);
            }
            detailJawaban.push(`Soal ${i}: ${val}`);
        }

        skorTotal = Math.round(skorTotal);

        // Ubah status tombol agar siswa tidak klik berkali-kali
        btnKirim.disabled = true;
        statusDiv.style.color = "#d35400";
        statusDiv.innerText = "Mengirim jawaban...";

        // Data yang dikirim ke Google Spreadsheet
        const dataPayload = {
            nama: nama,
            skor: skorTotal,
            curang: jumlahCurang,
            detailJawaban: detailJawaban.join(", ")
        };

        // Kirim data ke Google Sheets di latar belakang
        fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(dataPayload)
        })
        .then(() => {
            statusDiv.style.color = "#27ae60";
            statusDiv.innerHTML = "✅ <b>Jawaban Anda berhasil terkirim!</b><br>Terima kasih telah mengerjakan kuis.";
            document.getElementById("quizForm").style.display = "none";
        })
        .catch(error => {
            console.error("Error:", error);
            statusDiv.style.color = "#c0392b";
            statusDiv.innerText = "Gagal mengirim jawaban. Periksa koneksi internet Anda.";
            btnKirim.disabled = false;
        });
    }
</script>

</body>
</html>
