<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ujian Online</title>
    <style>
        /* 1. CSS MODERN & BERSIH */
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. ANTI GOOGLE LENS & COPY PASTE */
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            
            /* Mencegah text di-highlight untuk di-scan Lens */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none; 
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 30px;
            transition: all 0.3s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #D1D5DB;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .question-block {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            background: #F9FAFB;
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .options label {
            display: block;
            padding: 8px 12px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #D1D5DB;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .options label:hover {
            background: #EFF6FF;
        }

        #quiz-section, #result-section {
            display: none;
        }

        /* Styling Peringatan Alt-Tab */
        #warning-banner {
            display: none;
            background-color: #EF4444;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<!-- Atribut oncontextmenu untuk mencegah klik kanan (Anti Copy & Lens Desktop) -->
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <div class="container">
        <!-- Banner Peringatan Kecurangan -->
        <div id="warning-banner">⚠️ TERDETEKSI PINDAH TAB / ALT-TAB! (Peringatan ke-<span id="cheat-count">0</span>)</div>

        <!-- Section 1: Login Nama -->
        <div id="login-section">
            <h2>Masuk Ujian</h2>
            <div class="form-group">
                <!-- autocomplete="off" mencegah nama diingat oleh browser -->
                <input type="text" id="student-name" placeholder="Masukkan Nama Lengkap Anda" autocomplete="off">
            </div>
            <button onclick="startQuiz()">Mulai Ujian</button>
        </div>

        <!-- Section 2: Soal Ujian -->
        <div id="quiz-section">
            <h2 id="welcome-text"></h2>
            <div id="questions-container"></div>
            <button onclick="submitQuiz()" style="margin-top: 15px;">Kumpulkan Jawaban</button>
        </div>

        <!-- Section 3: Hasil -->
        <div id="result-section">
            <h2>Ujian Selesai</h2>
            <p style="text-align: center; font-size: 18px; margin-bottom: 20px;">
                Terima kasih, <strong id="result-name"></strong>.<br>
                Nilai Anda: <strong id="result-score" style="color: var(--primary-color); font-size: 24px;"></strong>
            </p>
            <button onclick="resetApp()">Kembali ke Awal</button>
        </div>
    </div>

    <script>
        // 3. MENGATASI "SOALNYA DIKIT" (Bank Soal Diperbanyak)
        const bankSoal = [
            { q: "Apa ibukota Indonesia?", options: ["Jakarta", "Bandung", "Surabaya", "Medan"], answer: 0 },
            { q: "Berapa hasil dari 5 x 6?", options: ["20", "25", "30", "35"], answer: 2 },
            { q: "Siapa penemu lampu pijar?", options: ["Nikola Tesla", "Thomas Alva Edison", "Albert Einstein", "Isaac Newton"], answer: 1 },
            { q: "Bahasa pemrograman web standar adalah?", options: ["Python", "C++", "HTML/CSS/JS", "Java"], answer: 2 },
            { q: "Planet terdekat dari matahari adalah?", options: ["Bumi", "Venus", "Merkurius", "Mars"], answer: 2 },
            { q: "Berapa jumlah warna pada pelangi?", options: ["5", "6", "7", "8"], answer: 2 },
            { q: "Apa nama benua terluas di dunia?", options: ["Afrika", "Amerika", "Asia", "Eropa"], answer: 2 }
        ];

        let cheatCounter = 0;
        let isExamActive = false;

        // 4. MENGATASI "BISA ALT TAB"
        document.addEventListener("visibilitychange", function() {
            if (document.hidden && isExamActive) {
                cheatCounter++;
                document.getElementById('cheat-count').innerText = cheatCounter;
                document.getElementById('warning-banner').style.display = "block";
                alert("⚠️ PERINGATAN: Anda terdeteksi melakukan Alt-Tab atau pindah aplikasi! Tindakan ini direkam oleh sistem.");
            }
        });

        // Hapus nama yang mungkin tersimpan di cache/session
        window.onload = () => {
            sessionStorage.removeItem("studentName");
            document.getElementById('student-name').value = "";
        };

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value.trim();
            if (!nameInput) {
                alert("Nama tidak boleh kosong!");
                return;
            }

            // Simpan nama di session (hanya untuk sesi ini, hilang jika direfresh)
            sessionStorage.setItem("studentName", nameInput);
            document.getElementById('welcome-text').innerText = "Selamat mengerjakan, " + nameInput + "!";
            
            document.getElementById('login-section').style.display = "none";
            document.getElementById('quiz-section').style.display = "block";
            isExamActive = true;

            renderQuestions();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            bankSoal.forEach((soal, index) => {
                let optionsHtml = "";
                soal.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label>
                            <input type="radio" name="q${index}" value="${optIndex}"> 
                            ${opt}
                        </label>
                    `;
                });

                const questionHtml = `
                    <div class="question-block">
                        <div class="question-text">${index + 1}. ${soal.q}</div>
                        <div class="options">${optionsHtml}</div>
                    </div>
                `;
                container.innerHTML += questionHtml;
            });
        }

        function submitQuiz() {
            let score = 0;
            bankSoal.forEach((soal, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected && parseInt(selected.value) === soal.answer) {
                    score += (100 / bankSoal.length); // Hitung bobot nilai
                }
            });

            isExamActive = false; // Matikan deteksi alt-tab setelah selesai
            document.getElementById('quiz-section').style.display = "none";
            document.getElementById('warning-banner').style.display = "none";
            document.getElementById('result-section').style.display = "block";

            document.getElementById('result-name').innerText = sessionStorage.getItem("studentName");
            document.getElementById('result-score').innerText = Math.round(score);
        }

        // 5. MENGATASI "NAMA-NAMANYA INGET"
        function resetApp() {
            sessionStorage.removeItem("studentName"); // Bersihkan nama
            document.getElementById('student-name').value = ""; // Kosongkan input
            cheatCounter = 0; // Reset cheat counter
            
            document.getElementById('result-section').style.display = "none";
            document.getElementById('login-section').style.display = "block";
        }
    </script>
</body>
</html>
