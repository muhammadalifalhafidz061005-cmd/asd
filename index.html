<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Past Perfect Tense</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --primary-light: #EEF2FF;
            --bg: #EEF2F7;
            --card: #FFFFFF;
            --text-main: #1F2937;
            --text-soft: #6B7280;
            --border: #E5E7EB;
            --success: #10B981;
            --danger: #EF4444;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 50%, #F5F3FF 100%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;

            /* Anti-Lens & Anti-Block Teks */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Dekorasi blob di background (di belakang semua konten) */
        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            z-index: -1;              /* <-- pastikan di belakang */
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: #A5B4FC;
            top: -120px; left: -120px;
            animation: floatBlob 14s ease-in-out infinite;
        }
        body::after {
            width: 360px; height: 360px;
            background: #C4B5FD;
            bottom: -120px; right: -120px;
            animation: floatBlob 18s ease-in-out infinite reverse;
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(30px, -30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--card);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            box-shadow:
                0 20px 40px -15px rgba(79, 70, 229, 0.25),
                0 8px 20px -10px rgba(0, 0, 0, 0.08);
            padding: 36px 34px;
            border: 1px solid rgba(255,255,255,0.8);
            animation: cardIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin: 0 0 25px;
            font-size: 24px;
            letter-spacing: -0.3px;
        }

        .form-group { margin-bottom: 20px; }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-main);
        }

        select {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #D1D5DB;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            background-color: white;
            transition: border-color 0.25s, box-shadow 0.25s;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 18px;
            padding-right: 42px;
        }
        select:hover  { border-color: #A5B4FC; }
        select:focus  { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }

        button {
            width: 100%;
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.25s, background 0.3s;
            box-shadow: 0 8px 18px -8px rgba(79, 70, 229, 0.7);
            letter-spacing: 0.3px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px -8px rgba(79, 70, 229, 0.85);
            background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
        }
        button:active  { transform: translateY(0) scale(0.99); }
        button:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .question-block {
            margin-bottom: 20px;
            padding: 18px 20px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: linear-gradient(180deg, #FAFBFF 0%, #F9FAFB 100%);
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .question-block:hover {
            border-color: #C7D2FE;
            box-shadow: 0 8px 18px -12px rgba(79, 70, 229, 0.4);
        }

        .question-text {
            font-weight: 600;
            margin-bottom: 14px;
            line-height: 1.6;
            font-size: 15px;
        }

        .options label {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: white;
            border: 1.5px solid #D1D5DB;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
        }
        .options label:hover {
            background: var(--primary-light);
            border-color: #A5B4FC;
            transform: translateX(3px);
        }
        .options label:has(input:checked) {
            background: var(--primary-light);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .options input {
            margin-right: 12px;
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #quiz-section, #loading-section, #result-section { display: none; }

        #warning-banner {
            display: none;
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 22px;
            font-weight: bold;
            box-shadow: 0 10px 20px -10px rgba(239, 68, 68, 0.7);
            animation: shake 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-6px); }
            40%      { transform: translateX(6px); }
            60%      { transform: translateX(-4px); }
            80%      { transform: translateX(4px); }
        }

        .loading-text {
            text-align: center;
            color: #D97706;
            font-weight: bold;
            font-size: 18px;
            padding: 20px 0;
        }
        .loading-text::before {
            content: "";
            display: inline-block;
            width: 20px; height: 20px;
            margin-right: 10px;
            vertical-align: -3px;
            border: 3px solid #FDE68A;
            border-top-color: #D97706;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result-section h2 { color: var(--success); }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin-bottom: 22px;
        }

        @media (max-width: 480px) {
            .container { padding: 26px 22px; border-radius: 16px; }
            h2 { font-size: 20px; }
            .question-text { font-size: 14px; }
            .options label { font-size: 14px; padding: 11px 12px; }
        }

        /* Hormati preferensi aksesibilitas */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;" ondrop="return false;">

    <div class="container">
        <div id="warning-banner">⚠️ TERDETEKSI PINDAH TAB! (Peringatan ke-<span id="cheat-count">0</span>)</div>

        <!-- Bagian 1: Pilih Nama -->
        <div id="login-section">
            <h2>Kuis Past Perfect Tense</h2>
            <div class="form-group">
                <label for="student-name">Pilih Nama Kamu:</label>
                <select id="student-name">
                    <option value="">-- Silakan Pilih Nama --</option>
                    <option value="Adzanta Anandapa Rusata">Adzanta Anandapa Rusata</option>
                    <option value="Akram Arrosyid">Akram Arrosyid</option>
                    <option value="Al Fathir Yugi Pratama">Al Fathir Yugi Pratama</option>
                    <option value="Anandha putra Bianka">Anandha putra Bianka</option>
                    <option value="Ar Rasyid Prakasa Pratama">Ar Rasyid Prakasa Pratama</option>
                    <option value="Arian Bimo Hidayat">Arian Bimo Hidayat</option>
                    <option value="Arkana Abdad Abbasyi">Arkana Abdad Abbasyi</option>
                    <option value="Arya wira hadiputra">Arya wira hadiputra</option>
                    <option value="Attar Farras Bardend Ropen">Attar Farras Bardend Ropen</option>
                    <option value="Hafizh Izzan Ardi Putra">Hafizh Izzan Ardi Putra</option>
                    <option value="Hamzah Aufaa Ibrahim">Hamzah Aufaa Ibrahim</option>
                    <option value="Ikbar Qaisar Arfarassyidan">Ikbar Qaisar Arfarassyidan</option>
                    <option value="Keanu Ibrahim Al Faris">Keanu Ibrahim Al Faris</option>
                    <option value="Moch Abdul Malik Arasyid">Moch Abdul Malik Arasyid</option>
                    <option value="Muhammad Alif alhafidz">Muhammad Alif alhafidz</option>
                    <option value="Muhammad Aysar Rizqin">Muhammad Aysar Rizqin</option>
                    <option value="Muhammad Taqiyyurohman Alfawwaz">Muhammad Taqiyyurohman Alfawwaz</option>
                    <option value="Nararya Irsyad Kelana">Nararya Irsyad Kelana</option>
                    <option value="Rafael Rayhan Hafidz">Rafael Rayhan Hafidz</option>
                    <option value="Rafandra Aqlan Lazuardi">Rafandra Aqlan Lazuardi</option>
                </select>
            </div>
            <button onclick="startQuiz()">Mulai Kerjakan</button>
        </div>

        <!-- Bagian 2: Soal Kuis -->
        <div id="quiz-section">
            <h2 id="welcome-text" style="font-size: 18px; color: #374151;"></h2>
            <hr style="border: 1px solid #E5E7EB; margin-bottom: 20px;">
            <div id="questions-container"></div>
            <button id="btn-submit" onclick="submitQuiz()">Kirim Jawaban</button>
        </div>

        <!-- Bagian 3: Loading -->
        <div id="loading-section">
            <p class="loading-text">Sedang mengirim jawabanmu...</p>
        </div>

        <!-- Bagian 4: Hasil -->
        <div id="result-section">
            <h2>✅ Berhasil!</h2>
            <p style="text-align: center; font-size: 16px;">
                Jawaban atas nama <strong id="result-name"></strong> telah dikirim. <br><br>
                Terima kasih telah mengerjakan kuis!
            </p>
        </div>
    </div>

    <script>
        // URL Google Spreadsheet
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqxCASYBYvIXVGOR0dLMWZh4909j00YonhQRuP8TQDdkfT1CapJ8R6odLSJSOQni3p/exec";

        // Bank Soal
        const bankSoal = [
            { q: "By the time the teacher arrived, the students _____ their homework.", options: ["finished", "had finished", "have finished"], answer: "had finished" },
            { q: "She couldn't buy the ticket because she _____ her wallet.", options: ["has lost", "was losing", "had lost"], answer: "had lost" },
            { q: "I _____ the movie before, so I didn't want to watch it again.", options: ["had seen", "have seen", "saw"], answer: "had seen" },
            { q: "They _____ for hours before the bus finally arrived.", options: ["had waited", "wait", "has waited"], answer: "had waited" },
            { q: "When I reached the station, the train _____.", options: ["had left", "has left", "leaves"], answer: "had left" },
            { q: "He _____ his breakfast when I came to his house.", options: ["eats", "have eaten", "had eaten"], answer: "had eaten" },
            { q: "The mechanic fixed the car after we _____ him.", options: ["had paid", "paid", "has paid"], answer: "had paid" },
            { q: "She _____ the report before the meeting started.", options: ["had finished", "finishes", "has finished"], answer: "had finished" },
            { q: "My mother _____ the floor when I dropped the glass.", options: ["sweeps", "had swept", "has swept"], answer: "had swept" },
            { q: "By 2020, he _____ in London for five years.", options: ["had lived", "lives", "has lived"], answer: "had lived" }
        ];

        let cheatCounter = 0;
        let isExamActive = false;
        let studentName = "";

        // Deteksi Alt-Tab
        document.addEventListener("visibilitychange", function() {
            if (document.hidden && isExamActive) {
                cheatCounter++;
                document.getElementById('cheat-count').innerText = cheatCounter;
                const banner = document.getElementById('warning-banner');
                banner.style.display = "block";
                // restart animasi shake
                banner.style.animation = 'none';
                void banner.offsetWidth;
                banner.style.animation = 'shake 0.5s ease';
            }
        });

        // Fungsi Mulai Kuis
        function startQuiz() {
            const selectElement = document.getElementById('student-name');
            studentName = selectElement.value;

            if (studentName === "") {
                alert("Harap pilih nama kamu terlebih dahulu dari daftar!");
                return;
            }

            document.getElementById('login-section').style.display = "none";
            document.getElementById('quiz-section').style.display = "block";
            document.getElementById('welcome-text').innerText = "Selamat Mengerjakan, " + studentName;

            isExamActive = true;
            renderQuestions();
        }

        // Render HTML Soal
        function renderQuestions() {
            const container = document.getElementById('questions-container');
            container.innerHTML = "";

            bankSoal.forEach((soal, index) => {
                let optionsHtml = "";
                soal.options.forEach((opt) => {
                    optionsHtml += `
                        <label>
                            <input type="radio" name="q${index}" value="${opt}"> 
                            ${opt}
                        </label>
                    `;
                });

                container.innerHTML += `
                    <div class="question-block">
                        <div class="question-text">${index + 1}. ${soal.q}</div>
                        <div class="options">${optionsHtml}</div>
                    </div>
                `;
            });
        }

        // Fungsi Kirim Kuis
        function submitQuiz() {
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;

            let skorTotal = 0;
            let detailJawaban = [];

            // Cek jawaban
            bankSoal.forEach((soal, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                const val = selectedOption ? selectedOption.value : "Kosong";

                if (val === soal.answer) {
                    skorTotal += (100 / bankSoal.length);
                }
                detailJawaban.push(`Soal ${index + 1}: ${val}`);
            });

            skorTotal = Math.round(skorTotal);
            isExamActive = false; // Matikan fitur deteksi curang setelah selesai

            // Ganti tampilan ke Loading
            document.getElementById('quiz-section').style.display = "none";
            document.getElementById('warning-banner').style.display = "none";
            document.getElementById('loading-section').style.display = "block";

            // Siapkan Data ke Google Sheets
            const dataPayload = {
                nama: studentName,
                skor: skorTotal,
                curang: cheatCounter,
                detailJawaban: detailJawaban.join(" | ")
            };

            // Kirim ke Google Apps Script
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataPayload)
            })
            .then(() => {
                document.getElementById('loading-section').style.display = "none";
                document.getElementById('result-section').style.display = "block";
                document.getElementById('result-name').innerText = studentName;
            })
            .catch(error => {
                alert("Gagal mengirim jawaban. Cek koneksi internetmu.");
                document.getElementById('loading-section').style.display = "none";
                document.getElementById('quiz-section').style.display = "block";
                btnSubmit.disabled = false;
            });
        }
    </script>
</body>
</html>
