            font-weight: bold;
            font-size: 18px;
        }

</head>

Sebagai pengingat singkat, Past Perfect Tense digunakan untuk menceritakan kejadian yang **sudah selesai** di masa lalu sebelum kejadian lain terjadi (Rumus: **Subject + had + Verb 3**).

Berikut adalah contoh kalimat Past Perfect super spesifik menggunakan semua nama yang kamu berikan:

### Contoh Kalimat Past Perfect (Beserta Artinya)

*   **Adzanta Anandapa Rusata** had already submitted his final physics project before the teacher announced the deadline extension.
    *(Adzanta Anandapa Rusata sudah mengumpulkan tugas akhir fisikanya sebelum guru mengumumkan perpanjangan tenggat waktu.)*
*   By the time **Akram Arrosyid** arrived at the train station, the express train to Jakarta had departed for twenty minutes.
